services:
  app:
    build:
      context: .
      target: production
    container_name: node_by_node_app
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: node_by_node
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/node_by_node
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: node-by-node-files
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_FORCE_PATH_STYLE: true
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: rag_documents
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      OPENAI_CHAT_MODEL: gpt-5.4-mini

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      clamav:
        condition: service_started
      qdrant:
        condition: service_started

  worker:
    build:
      context: .
      target: production
    command: node dist/src/file-processing-worker/main.js
    restart: on-failure
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/node_by_node
      RABBITMQ_URL: amqp://rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: node_by_node
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_REGION: us-east-1
      S3_BUCKET: node-by-node-files
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_FORCE_PATH_STYLE: true
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  rag-worker:
    build:
      context: .
      target: production
    command: node dist/src/rag-worker/main.js
    restart: on-failure
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/node_by_node
      RABBITMQ_URL: amqp://rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: node_by_node
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_REGION: us-east-1
      S3_BUCKET: node-by-node-files
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_FORCE_PATH_STYLE: true
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: rag_documents
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      OPENAI_CHAT_MODEL: gpt-5.4-mini
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: node_by_node_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: node_by_node
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d node_by_node"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: node_by_node_redis
    ports:
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: node_by_node_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: node_by_node_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: node_by_node_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  clamav:
    image: clamav/clamav:stable
    container_name: node_by_node_clamav
    ports:
      - "3310:3310"

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  qdrant_data:
